<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><json> <fetch></fetch></title>
  </head>
  <body>
    <h1>json/fetch</h1>
    <button onclick="llamar()">fetch</button>
    <button onclick="llamar2()">XMLHttpRequest</button>
    <button onclick="llamar3()">fetch async/await</button>
    <button onclick="llamar4()">fetch blob</button>
    <button onclick="llamar5()">???</button>
    <img src="" alt="" id="img1" />
    <img src="https://picsum.photos/id/1/200/200" alt="" id="img2" />
    <a href="https://picsum.photos/id/1/200/200">resultado</a>
    <script>
      function llamar() {
        url = "http://jsonplaceholder.typicode.com/users/1";
        parametros = "";
        fetch(url)
          .then((respuesta) => {
            usuario = respuesta.json();
            console.log(usuario);
            return usuario;
          })
          .then((datos) => {
            console.log(datos.name);
          })
          .catch((error) => {
            console.log(error);
          });
      }

      function llamar2() {
        url = "http://jsonplaceholder.typicode.com/users/1";
        xhttp = new XMLHttpRequest();
        xhttp.onload = function () {
          usuario = xhttp.response;
          u = JSON.parse(usuario);
          console.log(u.name);
        };
        xhttp.open("GET", url);
        xhttp.send();
      }

      function llamar3() {
        url = "http://jsonplaceholder.typicode.com/users/1";
        parametros = "";
        fetch(url)
          .then(async (respuesta) => {
            console.log("respuesta");
            console.log(respuesta);
            usuario = await respuesta.json();
            console.log(usuario);
            return usuario;
          })
          .catch((error) => {
            console.log(error);
          });
      }

      function llamar4() {
        url = "https://picsum.photos/id/1/200/200";
        fetch(url)
          .then((respuesta) => {
            console.log(respuesta);
            r = respuesta.blob();
            return r;
          })
          .then((datos) => {
            console.log(datos);
            imagen = URL.createObjectURL(datos);
            console.log(imagen);
            const img = document.getElementById("img1");
            img.src = imagen;
          })
          .catch((error) => {
            console.log(error);
          });
      }

      function llamar5() {
        url = ""
        .then()
        .then()
        .catch()
      }
    </script>
  </body>
</html>
